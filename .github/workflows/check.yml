# Compile and test without publishing anything.
#
# `build.yml` fires on a push to `main`, and a push to `main` is how this repository ships —
# there is no review step between a mistake and the phone. This is that step: push the branch,
# wait for it to go green, then push `main`. It runs the same unit tests, the same Android lint
# and the same debug compile as the trusted build, and stops short of uploading an artifact,
# signing anything or cutting a release.
#
# Until this existed, `main` was not even the default branch, so a commit that landed on the
# default branch alone was compiled by nothing at all.
name: Check

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, lint, and compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The module is :tool, not :app — this repository builds a Light SDK tool, not an
      # Android application. sdk:ui pulls com.thelightphone.lp3keyboard:ui from GitHub
      # Packages, so the checks need those credentials even though they publish nothing.
      - name: Run app checks
        env:
          GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug --stacktrace
