[tool]
# The id does not change with the name. Android identifies an install by it, so renaming it would
# orphan every subscription, saved article and read state already on the phone.
id = "com.lightrss.reader"
label = "News"
versionCode = 30
versionName = "2.9.0"
permissions = [
    "android.permission.INTERNET",
    "android.permission.CAMERA",
    # Lifts LightOS's forced greyscale while an image is on screen; see ColorMode.kt. This one is
    # signature|privileged|development, so declaring it does nothing until it is granted once over
    # adb, and the app degrades to grey without it rather than failing:
    #   adb shell pm grant com.lightrss.reader android.permission.WRITE_SECURE_SETTINGS
    "android.permission.WRITE_SECURE_SETTINGS",
]
# Real Light Phone III builds communicate with LightOS. Use
# "com.thelightphone.sdk.emulator" temporarily for local emulator runs.
serverPackage = "com.lightos"
